[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivetracered"
version = "1.0.17"
description = "LLM Red Teaming Framework for defensive security research"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "HiveTrace", email = "sales@raftds.com"}
]
requires-python = ">=3.10"
keywords = ["llm", "red-team", "security", "testing", "adversarial", "ai-safety"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core utilities - permissive lower bounds for wide compatibility
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=23.0.1,<26.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "aiohttp>=3.14.1,<4.0.0",
    "requests>=2.28.0,<3.0.0",
    # LangChain ecosystem - 1.x line (security floors, see 1.0.17 release notes)
    # langchain itself dropped: only langchain-core symbols are used.
    # langchain-community dropped: ChatLlamaCpp is lazily imported (optional).
    "langchain-core>=1.4.9,<2.0.0",
    "langchain-openai>=1.3.5,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-gigachat>=0.5.1,<1.0.0",
    "langchain-google-genai>=4.2.7,<5.0.0",
    # Transitive via langchain-core, floor pinned for security (PYSEC-2026-2582)
    "langsmith>=0.8.18,<2.0.0",
    # Google AI
    "google-genai>=1.0.0,<2.0.0",
    # Other dependencies
    "yandex-ai-studio-sdk>=0.19.0,<1.0.0",
    "cyrtranslit>=1.2.0,<2.0.0",
    "plotly>=5.0.0,<6.0.0",
    "numpy>=1.24.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "jsonpath-ng>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "twine>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-autodoc-typehints>=1.22.0",
    "furo>=2023.3.27",
]
web = [
    "playwright>=1.57.0",
    "nest_asyncio>=1.6.0",
]
llamacpp = [
    "langchain-community>=0.4.2,<0.5.0",
    "llama-cpp-python>=0.3.0",
]
all = ["hivetracered[dev,docs,web,llamacpp]"]

[project.urls]
Homepage = "https://github.com/HiveTrace/HiveTraceRed"
Documentation = "https://hivetrace.github.io/HiveTraceRed/"
Repository = "https://github.com/HiveTrace/HiveTraceRed"
Issues = "https://github.com/HiveTrace/HiveTraceRed/issues"

[project.scripts]
hivetracered = "hivetracered.__main__:main"
hivetracered-report = "hivetracered.report:main"
hivetracered-recorder = "hivetracered.utils.web_action_recorder:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hivetracered*"]

[tool.pytest.ini_options]
markers = ["real_model: tests that make real API calls (uses tokens)"]

[tool.coverage.run]
branch = true
source = ["src/hivetracered"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.package-data]
hivetracered = [
    "evaluators/data/*.csv",
    "attacks/types/**/*.yaml",
]
